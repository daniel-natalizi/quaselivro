# Configurações do Site
title: QuaseLivro
name: Daniel A. Natalizi
description: Informações e opiniões
url: "https://daniel-natalizi.github.io"  # Troque pelo seu usuário
baseurl: "/quaselivro"       # Troque pelo nome do seu repositório

# Configuração do Tema
remote_theme: "mmistakes/minimal-mistakes@4.26.2"

# Plugins (obrigatório para o tema funcionar)
plugins:
  - jekyll-include-cache

# Configurações de Build
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Configuração de URLs (importante para o GitHub Pages)
permalink: /:categories/:title/

# Configuração para postagens
defaults:
  - scope:
      path: "/quaselivro"
      type: "posts"
    values:
      permalink: /:categories/:title/

# Collections (para posts)
collections:
  posts:
    output: true
    permalink: /:collection/:path/

# Configurações do Autor (opcional)
author:
  name: "Daniel Natalizi"
  avatar: ""  # Coloque um link para sua foto se quiser
  bio: "Opiniões e informações"
  location: "Brasil"
